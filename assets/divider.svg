<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" role="img" aria-label="Section break">
<title>Section break</title>
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
    <feColorMatrix values="0 0 0 0 0.36  0 0 0 0 0.29  0 0 0 0 0.18  0 0 0 0.10 0"/>
  </filter>
  <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#33291f" flood-opacity="0.20"/>
    <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#33291f" flood-opacity="0.18"/>
  </filter>
  <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f8f5ec"/>
    <stop offset="1" stop-color="#efe9da"/>
  </linearGradient></defs>

  <defs><linearGradient id="fade" x1="0" x2="1">
    <stop offset="0" stop-color="#b5a785" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#b5a785" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#b5a785" stop-opacity="0"/></linearGradient></defs>
  <rect x="80" y="12.0" width="840" height="1" fill="url(#fade)"/>
</svg>
